{% extends 'core/base.html' %}{% block content %}<div class='scanner'><h1>QR / Barcode Scanner</h1><p class='small'>Allow camera access. For best results use HTTPS or localhost. You can also enter a barcode manually.</p><div id='reader' style='width:100%'></div><label>Scanned value</label><input id='result' autocomplete='off'><button onclick="copyValue('result')">Copy Scanned Value</button><button onclick="openIssue()">Use for Issue</button><button onclick="openReturn()">Use for Return</button><p id='status' class='small'></p></div><script src='https://unpkg.com/html5-qrcode' type='text/javascript'></script><script>const out=document.getElementById('result'), status=document.getElementById('status'); function onScanSuccess(decodedText){out.value=decodedText;status.textContent='Scanned successfully: '+decodedText;} function onScanFailure(error){ } if(window.Html5QrcodeScanner){const scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:180},rememberLastUsedCamera:true});scanner.render(onScanSuccess,onScanFailure)}else{status.textContent='Scanner library could not load. Enter barcode manually.';} function copyValue(id){document.getElementById(id).select();navigator.clipboard?.writeText(document.getElementById(id).value);} function openIssue(){location.href='/issue/?barcode='+encodeURIComponent(out.value)} function openReturn(){location.href='/return/?barcode='+encodeURIComponent(out.value)}</script>{% endblock %}
