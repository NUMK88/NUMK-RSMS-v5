{% extends 'core/base.html' %}{% block content %}<h2>My Notifications</h2>{% for n in notifications %}<div class='card' style='margin-bottom:10px'><b>{{n.title}}</b> <span class='small'>{{n.created_at}}</span><p>{{n.message}}</p>{% if not n.read_at %}<a class='btn' href='/notifications/{{n.id}}/read/'>Mark as read</a>{% else %}<span class='pill'>Read</span>{% endif %}</div>{% empty %}<div class='card'>No notifications.</div>{% endfor %}{% endblock %}
